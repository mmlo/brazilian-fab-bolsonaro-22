  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #04140c; color: #d7f5df; font-family: "Noto Sans SC", sans-serif; }
    #canvas { display: block; width: 100%; height: 100%; outline: none; }
    #loading { position: fixed; inset: 0; display: grid; place-content: center; gap: 18px; text-align: center;
      padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
      background:
        radial-gradient(ellipse 60% 45% at 70% 35%, rgba(0, 120, 50, .35), transparent 70%),
        radial-gradient(ellipse 50% 40% at 25% 70%, rgba(220, 180, 20, .22), transparent 70%),
        radial-gradient(1px 1px at 20% 30%, #fff, transparent), radial-gradient(1px 1px at 80% 20%, #cfe, transparent),
        radial-gradient(1px 1px at 60% 80%, #fff, transparent), radial-gradient(1px 1px at 35% 85%, #dcf, transparent),
        radial-gradient(1px 1px at 90% 65%, #fff, transparent), radial-gradient(1px 1px at 10% 55%, #bdf, transparent),
        #04140c; }
    #loading[hidden], [hidden] { display: none !important; }
    h1 { margin: 0; font-size: clamp(34px, 7vw, 64px); letter-spacing: .08em; font-weight: 700; color: #ffe14a;
      text-shadow: 0 4px 0 #0b6b32, 0 0 18px rgba(40, 180, 70, .45); overflow-wrap: anywhere; }
    #game-sub { margin: -8px 0 6px; color: #3ddc6a; letter-spacing: .18em; font-size: 14px; font-weight: 700; }
    p { margin: 0; }
    #loading-status { font-size: 14px; color: #9dccab; letter-spacing: .08em; }
    progress { -webkit-appearance: none; appearance: none; width: min(340px, 75vw); height: 14px; justify-self: center;
      border: 2px solid #1e8a45; background: #06210f; image-rendering: pixelated; }
    progress::-webkit-progress-bar { background: #06210f; }
    progress::-webkit-progress-value { background: repeating-linear-gradient(90deg, #ffe14a 0 10px, #1e8a45 10px 12px); }
    progress::-moz-progress-bar { background: #ffe14a; }
    button { justify-self: center; padding: 10px 26px; cursor: pointer; font: inherit; font-weight: 700; color: #fff;
      background: #06210f; border: 2px solid #ffe14a; }
    #loading-notice { max-width: 360px; justify-self: center; line-height: 1.5; font-size: 14px; }
    @media (prefers-reduced-motion: no-preference) { h1 { animation: glow 2.4s ease-in-out infinite alternate; } }
    @keyframes glow { to { text-shadow: 0 4px 0 #0b6b32, 0 0 28px rgba(255, 220, 60, .7); } }
  </style>

<body>
  <canvas id="canvas" tabindex="0">Your browser does not support canvas.</canvas>
  <section id="loading" role="status">
    <h1 id="game-title"></h1>
    <p id="game-sub">FORÇA AÉREA BRASILEIRA</p>
    <p id="loading-status">Loading…</p>
    <progress id="loading-progress" aria-label="Download progress"></progress>
    <p id="loading-notice" hidden></p>
    <button id="loading-retry" type="button" hidden>Retry</button>
    <noscript>JavaScript is required to play this game.</noscript>
  </section>
  <script>
    (() => {
      const config = $GODOT_CONFIG;
      const threads = $GODOT_THREADS_ENABLED;
      const canvas = document.getElementById('canvas');
      const loading = document.getElementById('loading');
      const status = document.getElementById('loading-status');
      const progress = document.getElementById('loading-progress');
      const notice = document.getElementById('loading-notice');
      const retry = document.getElementById('loading-retry');
      // A language chosen in game wins; otherwise follow the browser's preferred language.
      let zh = String((navigator.languages && navigator.languages[0]) || navigator.language || '').toLowerCase().startsWith('zh');
      try { const saved = localStorage.getItem('starveil-barrage.locale'); if (saved === 'en' || saved === 'zh-CN') zh = saved === 'zh-CN'; } catch (_) {}
      document.documentElement.lang = zh ? 'zh-CN' : 'en';
      document.getElementById('game-title').textContent = 'BOLSONARO 22';
      document.getElementById('game-sub').textContent = zh ? '巴西空军 FAB' : 'FORÇA AÉREA BRASILEIRA';
      status.textContent = zh ? '正在加载…' : 'Loading…';
      retry.textContent = zh ? '重试' : 'Retry';
      progress.setAttribute('aria-label', zh ? '下载进度' : 'Download progress');
      retry.addEventListener('click', () => window.location.reload());
      let failed = false;
      let ready = false;
      const startedAt = performance.now();
      let lastProgressAt = startedAt;
      let downloadedBytes = 0;
      let downloadComplete = false;
      const updateNotice = () => {
        if (failed || ready || performance.now() - startedAt < 30000) return;
        notice.hidden = false;
        retry.hidden = false;
        const message = performance.now() - lastProgressAt >= 30000
          ? (zh ? '暂未看到新的加载进度。可以继续等待，或重试。' : 'No recent loading progress. You can keep waiting or retry.')
          : (zh ? '仍在加载。可以继续等待，或重试。' : 'Still loading. You can keep waiting or retry.');
        if (notice.textContent !== message) notice.textContent = message;
      };
      const onWindowError = (event) => fail(event.error || new Error('Engine startup error'));
      const onUnhandledRejection = (event) => fail(event.reason || new Error('Engine startup rejected'));
      // Time alone cannot prove failure: downloads and WASM compilation may be slow.
      const startupWatch = setInterval(updateNotice, 1000);
      const stopObserving = () => {
        clearInterval(startupWatch);
        window.removeEventListener('error', onWindowError);
        window.removeEventListener('unhandledrejection', onUnhandledRejection);
      };
      const fail = (error) => {
        if (failed || ready) return;
        failed = true;
        stopObserving();
        console.error('[game-loading] Startup failed', error);
        loading.hidden = false;
        status.textContent = zh ? '游戏加载失败，请重试。' : 'Unable to load the game. Please retry.';
        progress.hidden = true;
        notice.hidden = true;
        retry.hidden = false;
      };
      // Some Godot bootstrap promises do not forward download/compile failures.
      window.addEventListener('error', onWindowError);
      window.addEventListener('unhandledrejection', onUnhandledRejection);
      const onProgress = (current, total) => {
        if (failed || ready) return;
        // Repeated/unknown totals do not renew liveness; growing byte counts do.
        if (Number.isFinite(current) && current > downloadedBytes) {
          downloadedBytes = current;
          lastProgressAt = performance.now();
        }
        if (!downloadComplete && Number.isFinite(total) && total > 0 && Number.isFinite(current) && current >= total) {
          downloadComplete = true;
          lastProgressAt = performance.now();
        }
        updateNotice();
        if (!Number.isFinite(total) || total <= 0 || !Number.isFinite(current) || current < 0) {
          progress.removeAttribute('value');
          status.textContent = zh ? '正在加载…' : 'Loading…';
          return;
        }
        progress.max = total;
        progress.value = Math.min(current, total);
        status.textContent = current >= total
          ? (zh ? '正在启动游戏…' : 'Starting game…')
          : `${Math.floor(current / total * 100)}%`;
      };
      const start = async () => {
        if (failed) return;
        try {
          lastProgressAt = performance.now();
          const missing = Engine.getMissingFeatures({ threads });
          if (missing.length) throw new Error(`Missing browser features: ${missing.join(', ')}`);
          const engine = new Engine({ ...config, canvas });
          await engine.startGame({ onProgress });
          if (failed) return;
          ready = true;
          stopObserving();
          notice.hidden = true;
          retry.hidden = true;
          // Download completion alone is not engine readiness.
          requestAnimationFrame(() => requestAnimationFrame(() => {
            if (failed) return;
            loading.hidden = true;
            if (config['focusCanvas']) canvas.focus();
          }));
        } catch (error) {
          fail(error);
        }
      };
      const script = document.createElement('script');
      script.src = '$GODOT_URL';
      script.addEventListener('load', start, { once: true });
      script.addEventListener('error', () => fail(new Error('Engine script could not be loaded')), { once: true });
      document.head.appendChild(script);
    })();
  </script>
</body>
